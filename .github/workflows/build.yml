name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 用來把 IPA 發佈到 Releases

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: python3 tools/make_xcodeproj.py

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $SIM_ID"
          xcodebuild test \
            -project CarLyrics.xcodeproj \
            -scheme CarLyrics \
            -only-testing:CarLyricsTests \
            -destination "id=$SIM_ID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case .* (passed|failed)|Executed|TEST" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CarLyrics.xcodeproj \
            -scheme CarLyrics \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee xcodebuild.log | grep -E "error:|BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0

      # 把 git SHA 寫進 Info.plist，除錯頁會顯示（確認手機上裝的是哪一版）
      - name: Stamp build info
        run: |
          APP=build/Build/Products/Release-iphoneos/CarLyrics.app
          plutil -replace CLGitSHA -string "${{ github.sha }}" "$APP/Info.plist"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleVersion|CLGitSHA"

      # 用 ad-hoc 簽章把 entitlements（App Group）寫進執行檔，
      # Sideloadly 重簽時才會幫你註冊 App Group。
      - name: Embed entitlements (ad-hoc)
        run: |
          APP=build/Build/Products/Release-iphoneos/CarLyrics.app
          codesign -f -s - --entitlements Config/CarLyricsWidget.entitlements "$APP/PlugIns/CarLyricsWidget.appex"
          codesign -f -s - --entitlements Config/CarLyrics.entitlements "$APP"
          codesign -d --entitlements - "$APP"

      - name: Package IPA
        run: |
          rm -rf Payload CarLyrics.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CarLyrics.app Payload/
          # 用 ditto 保留 symlink 與權限（比 zip 更符合 iOS 的 IPA 格式）
          ditto -c -k --norsrc --keepParent Payload CarLyrics.ipa

      - name: Verify IPA
        run: |
          set -e
          unzip -l CarLyrics.ipa
          rm -rf verify && mkdir verify && unzip -q CarLyrics.ipa -d verify
          APP=verify/Payload/CarLyrics.app
          test -f "$APP/Info.plist"
          test -f "$APP/PlugIns/CarLyricsWidget.appex/Info.plist"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleExecutable|MinimumOSVersion"
          lipo -info "$APP/CarLyrics"
          lipo -info "$APP/PlugIns/CarLyricsWidget.appex/CarLyricsWidget"
          ls -la "$APP"

      # 診斷用變體（都用 ad-hoc 簽章、不帶 entitlements，讓 Sideloadly 重簽）：
      #   CarLyrics-noappgroup.ipa：有 Widget Extension，沒有 App Group
      #   CarLyrics-minimal.ipa   ：沒有 Widget Extension，沒有 App Group
      - name: Package diagnostic IPAs
        run: |
          SRC=build/Build/Products/Release-iphoneos/CarLyrics.app
          make_ipa () {  # $1=輸出檔名 $2=是否保留 PlugIns(yes/no)
            rm -rf stage && mkdir -p stage/Payload
            cp -R "$SRC" stage/Payload/
            APPD=stage/Payload/CarLyrics.app
            if [ "$2" = "no" ]; then
              rm -rf "$APPD/PlugIns"
            else
              codesign -f -s - "$APPD/PlugIns/CarLyricsWidget.appex"
            fi
            codesign -f -s - "$APPD"
            codesign -dv "$APPD" 2>&1 | head -5
            (cd stage && ditto -c -k --norsrc --keepParent Payload "../$1")
            unzip -l "$1"
          }
          make_ipa CarLyrics-noappgroup.ipa yes
          make_ipa CarLyrics-minimal.ipa no

      # 固定網址，可直接下載 .ipa（不會被包成 zip）：
      # https://github.com/<owner>/<repo>/releases/download/latest-build/CarLyrics.ipa
      - name: Publish to Releases (latest-build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build CarLyrics.ipa CarLyrics-noappgroup.ipa CarLyrics-minimal.ipa \
            --prerelease \
            --title "Latest build #${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}（未簽署，請用 Sideloadly 安裝）" \
            --target "${{ github.sha }}"

      - uses: actions/upload-artifact@v5
        with:
          name: CarLyrics-ipa
          path: CarLyrics.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            test.log
          if-no-files-found: ignore
          retention-days: 7
