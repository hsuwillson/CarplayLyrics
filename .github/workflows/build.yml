name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: python3 tools/make_xcodeproj.py

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $SIM_ID"
          xcodebuild test \
            -project CarLyrics.xcodeproj \
            -scheme CarLyrics \
            -only-testing:CarLyricsTests \
            -destination "id=$SIM_ID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case .* (passed|failed)|Executed|TEST" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CarLyrics.xcodeproj \
            -scheme CarLyrics \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log | grep -E "error:|BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0

      # 用 ad-hoc 簽章把 entitlements（App Group）寫進執行檔，
      # Sideloadly 重簽時才會幫你註冊 App Group。
      - name: Embed entitlements (ad-hoc)
        run: |
          APP=build/Build/Products/Release-iphoneos/CarLyrics.app
          codesign -f -s - --entitlements Config/CarLyricsWidget.entitlements "$APP/PlugIns/CarLyricsWidget.appex"
          codesign -f -s - --entitlements Config/CarLyrics.entitlements "$APP"
          codesign -d --entitlements - "$APP"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CarLyrics.app Payload/
          zip -qry CarLyrics-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CarLyrics-unsigned-ipa
          path: CarLyrics-unsigned.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            test.log
          if-no-files-found: ignore
          retention-days: 7
