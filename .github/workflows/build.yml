name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 用來把 IPA 發佈到 Releases

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: python3 tools/make_xcodeproj.py

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $SIM_ID"
          xcodebuild test \
            -project CarLyrics.xcodeproj \
            -scheme CarLyrics \
            -only-testing:CarLyricsTests \
            -destination "id=$SIM_ID" \
            -derivedDataPath build-tests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 && status=0 || status=$?
          grep -E "error:|Test Case .* (passed|failed)|Executed|TEST" test.log || true
          if [ "$status" -ne 0 ]; then
            echo "::error::單元測試失敗（exit $status）"
            grep -E "error:|failed|Failing tests|Testing failed|Unable to|Could not" test.log | head -60
            # 做成 annotation，在 Actions 頁面上直接看得到
            grep -E "error:|failed|Unable to|Could not" test.log | sort -u | head -20 | cut -c1-300 | sed 's/^/::error::/'
            tail -25 test.log | cut -c1-300 | sed 's/^/::notice::/'
            exit "$status"
          fi

      - name: Coverage (Core)
        if: success()
        continue-on-error: true
        run: |
          xcrun xccov view --report --json TestResults.xcresult > cov.json
          python3 - <<'PY'
          import json, re, subprocess, os
          d = json.load(open("cov.json"))
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          summary.write("## 單元測試覆蓋率（Core）\n\n| 檔案 | 覆蓋率 |\n|---|---|\n")
          total_cov = total_exe = 0
          for t in d["targets"]:
              for f in t["files"]:
                  if "/Core/" not in f["path"]:
                      continue
                  total_cov += f["coveredLines"]; total_exe += f["executableLines"]
                  pct = f["lineCoverage"] * 100
                  summary.write(f"| {f['name']} | {pct:.1f}% |\n")
                  if f["coveredLines"] < f["executableLines"]:
                      out = subprocess.run(["xcrun", "xccov", "view", "--archive", "--file", f["path"], "TestResults.xcresult"],
                                           capture_output=True, text=True).stdout
                      miss, cur = [], None
                      for l in out.splitlines():
                          m = re.match(r"^\s*(\d+):\s*(\S+)", l)
                          if m:
                              cur = m.group(1)
                              if m.group(2) == "0":
                                  miss.append(cur)
                                  continue
                          # 同一行裡有沒執行到的區段（例如 ?? 右邊、沒呼叫過的 closure）
                          if cur and re.search(r"\b0\)", l) and cur not in miss:
                              miss.append(cur + "(部分)")
                      print(f"::warning::覆蓋率 {f['name']} {pct:.1f}%，未執行的行：{','.join(miss[:60])}")
          pct = 100 * total_cov / max(total_exe, 1)
          summary.write(f"\n**Core 合計：{pct:.2f}%（{total_cov}/{total_exe} 行）**\n")
          print(f"::notice::Core 覆蓋率 {pct:.2f}%（{total_cov}/{total_exe} 行）")
          PY

      - name: SwiftLint (warnings only)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          which swiftlint || brew install swiftlint
          swiftlint lint --quiet --reporter github-actions-logging || true

      # 測試失敗也照樣編譯 App，一次看到所有編譯錯誤
      - name: Build (no signing)
        if: ${{ !cancelled() }}
        run: |
          xcodebuild build \
            -project CarLyrics.xcodeproj \
            -scheme CarLyrics \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            > xcodebuild.log 2>&1 && status=0 || status=$?
          grep -E "BUILD (SUCCEEDED|FAILED)" xcodebuild.log || true
          if [ "$status" -ne 0 ]; then
            echo "::error::編譯失敗（exit $status），錯誤如下："
            grep -E "error:" xcodebuild.log | sort -u | head -60
            # 每個錯誤也做成 annotation，在 Actions 頁面上直接看得到
            grep -E "^/.*error:" xcodebuild.log | sort -u | head -20 | sed 's/^/::error::/'
            exit "$status"
          fi

      # 把 git SHA 寫進 Info.plist，除錯頁會顯示（確認手機上裝的是哪一版）
      - name: Stamp build info
        run: |
          APP=build/Build/Products/Release-iphoneos/CarLyrics.app
          plutil -replace CLGitSHA -string "${{ github.sha }}" "$APP/Info.plist"
          plutil -replace CLBuildDate -string "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$APP/Info.plist"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleVersion|CLGitSHA|CLBuildDate"

      # 用 ad-hoc 簽章把 entitlements（App Group）寫進執行檔，
      # Sideloadly 重簽時才會幫你註冊 App Group。
      - name: Embed entitlements (ad-hoc)
        run: |
          APP=build/Build/Products/Release-iphoneos/CarLyrics.app
          codesign -f -s - --entitlements Config/CarLyricsWidget.entitlements "$APP/PlugIns/CarLyricsWidget.appex"
          codesign -f -s - --entitlements Config/CarLyrics.entitlements "$APP"
          codesign -d --entitlements - "$APP"

      - name: Package IPA
        run: |
          rm -rf Payload CarLyrics.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CarLyrics.app Payload/
          # 用 ditto 保留 symlink 與權限（比 zip 更符合 iOS 的 IPA 格式）
          ditto -c -k --norsrc --keepParent Payload CarLyrics.ipa

      - name: Verify IPA
        run: |
          set -e
          unzip -l CarLyrics.ipa
          rm -rf verify && mkdir verify && unzip -q CarLyrics.ipa -d verify
          APP=verify/Payload/CarLyrics.app
          test -f "$APP/Info.plist"
          test -f "$APP/PlugIns/CarLyricsWidget.appex/Info.plist"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleExecutable|MinimumOSVersion"
          lipo -info "$APP/CarLyrics"
          lipo -info "$APP/PlugIns/CarLyricsWidget.appex/CarLyricsWidget"
          ls -la "$APP"

      # 診斷用變體（都用 ad-hoc 簽章、不帶 entitlements，讓 Sideloadly 重簽）：
      #   CarLyrics-noappgroup.ipa：有 Widget Extension，沒有 App Group
      #   CarLyrics-minimal.ipa   ：沒有 Widget Extension，沒有 App Group
      - name: Package diagnostic IPAs
        run: |
          SRC=build/Build/Products/Release-iphoneos/CarLyrics.app
          make_ipa () {  # $1=輸出檔名 $2=是否保留 PlugIns(yes/no)
            rm -rf stage && mkdir -p stage/Payload
            cp -R "$SRC" stage/Payload/
            APPD=stage/Payload/CarLyrics.app
            if [ "$2" = "no" ]; then
              rm -rf "$APPD/PlugIns"
            else
              codesign -f -s - "$APPD/PlugIns/CarLyricsWidget.appex"
            fi
            codesign -f -s - "$APPD"
            codesign -dv "$APPD" 2>&1 | head -5
            (cd stage && ditto -c -k --norsrc --keepParent Payload "../$1")
            unzip -l "$1"
          }
          make_ipa CarLyrics-noappgroup.ipa yes
          make_ipa CarLyrics-minimal.ipa no

      # 固定網址，可直接下載 .ipa（不會被包成 zip）：
      # https://github.com/<owner>/<repo>/releases/download/latest-build/CarLyrics.ipa
      - name: Publish to Releases (latest-build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build CarLyrics.ipa CarLyrics-noappgroup.ipa CarLyrics-minimal.ipa \
            --prerelease \
            --title "Latest build #${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}（未簽署，請用 AltStore / AltServer 安裝）" \
            --target "${{ github.sha }}"

      # 更新 AltStore 來源：手機上的 AltStore 按一下就能更新（不必再從電腦 sideload）
      - name: Update AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime
          path = "altstore/apps.json"
          data = json.load(open(path))
          size = os.path.getsize("CarLyrics.ipa")
          version = data["apps"][0]["versions"][0]
          version["buildVersion"] = "${{ github.run_number }}"
          version["date"] = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          version["size"] = size
          version["localizedDescription"] = "CI #${{ github.run_number }}（commit ${{ github.sha }}）"
          # 舊版 AltStore / SideStore 只看 app 層的這幾個欄位
          app = data["apps"][0]
          app["version"] = version["version"]
          app["versionDate"] = version["date"]
          app["versionDescription"] = version["localizedDescription"]
          app["downloadURL"] = version["downloadURL"]
          app["size"] = size
          json.dump(data, open(path, "w"), ensure_ascii=False, indent=2)
          PY
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add altstore/apps.json
          git diff --cached --quiet || git commit -m "AltStore source: build #${{ github.run_number }} [skip ci]"
          git push origin HEAD:main || echo "push 失敗（可能有新的 commit），下次建置會補上"
          # 備用網址：有些網路連不到 raw.githubusercontent.com，改用 github.com 的 release 資產
          gh release upload latest-build altstore/apps.json --clobber

      - uses: actions/upload-artifact@v5
        with:
          name: CarLyrics-ipa
          path: CarLyrics.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            test.log
            TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
